<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Modular kitchen, electrical, plumbing and painting work in Sankarankovil, Tenkasi. Free site visit."><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meenthulli Home"><style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Meenthulli Home Services</title>
<meta property="og:title" content="Meenthulli Home Services · Sankarankovil">
<meta property="og:description" content="Modular kitchen, electrical, plumbing and painting work. Free site visit and written quote.">
<meta property="og:image" content="https://meenthulli.com/graphics/home-services-design-6-bold.png">
<meta property="og:url" content="https://meenthulli.com/services/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#121316">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Mukta+Malar:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: "nordic bold" app. Dark hero, big colour tiles per service, white cards, bottom tab bar with a raised Book button */
:root{
  --bg:#f3f2ee; --card:#ffffff; --ink:#121316; --ink-2:#4a4d55; --mute:#7c808a; --line:#e4e2dc;
  --dark:#121316; --on-dark:#ffffff; --yellow:#ffc83a; --on-yellow:#121316;
  --kitchen:#e2734a; --electric:#f2b417; --plumb:#2f74d0; --paint:#2a9a68;
  --font:"Plus Jakarta Sans","Mukta Malar",system-ui,sans-serif;
  --nav-h:68px; --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0e10; --card:#1a1c20; --ink:#f1f1ef; --ink-2:#c4c6cc; --mute:#8d919b; --line:#2a2d33;
  --dark:#1a1c20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0e10; --card:#1a1c20; --ink:#f1f1ef; --ink-2:#c4c6cc; --mute:#8d919b; --line:#2a2d33;
  --dark:#1a1c20; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
h1,h2,h3{font-weight:800;line-height:1.1;margin:0;letter-spacing:-.025em;text-wrap:balance;overflow-wrap:anywhere}
:lang(ta) h1,:lang(ta) h2,:lang(ta) h3{letter-spacing:0;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.tag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
:lang(ta) .tag{letter-spacing:0;text-transform:none;font-size:.9rem}

/* hero (dark) */
.hero{background:#121316;color:#fff;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:28px;border-radius:0 0 32px 32px;display:grid;gap:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:60px;width:220px;height:220px;border-radius:50%;background:var(--yellow);opacity:.13}
.top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.logo{width:40px;height:40px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.word{flex:1;min-width:0;line-height:1.15}
.word b{display:block;font-weight:800;font-size:1.1rem}
.word small{font-size:.78rem;color:#b9bcc4}
.tbtn{border:1px solid rgba(255,255,255,.22);background:none;color:#fff;border-radius:999px;height:40px;min-width:40px;padding:0 14px;display:grid;place-items:center;font-size:.9rem;font-weight:600;text-decoration:none}
.tbtn svg{width:18px;height:18px}
.hero .open{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:#d7d9de;position:relative;z-index:1}
.hero .open i{width:8px;height:8px;border-radius:50%;background:#3ad07a;box-shadow:0 0 0 4px rgba(58,208,122,.2)}
.hero h1{font-size:2.7rem;position:relative;z-index:1}
.hero h1 em{font-style:normal;color:var(--yellow)}
:lang(ta) .hero h1{font-size:2.05rem}
.hero .lead{color:#c9ccd3;font-size:1rem;position:relative;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.chips span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:999px;padding:7px 12px;font-size:.85rem;font-weight:600}
.chips svg{width:15px;height:15px;color:var(--yellow)}
.cta{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;position:relative;z-index:1}
.btn{border:0;border-radius:16px;padding:16px 18px;font-weight:700;font-size:1rem;background:var(--ink);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;gap:10px;justify-content:center;text-align:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.y{background:var(--yellow);color:var(--on-yellow)}
.btn.ghost{background:none;color:inherit;border:1.5px solid currentColor}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.btn.wa{background:#1f9d55;color:#fff}
.btn.block{display:flex;width:100%}

.view{display:grid;gap:30px;padding-top:24px}
.view.first{padding-top:0}
.sec{display:grid;gap:14px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:10px}
.sh h2{font-size:1.55rem}
.sh .more{border:0;background:none;color:var(--ink-2);font-weight:700;font-size:.9rem;padding:0;display:flex;align-items:center;gap:4px}
.sh .more svg{width:14px;height:14px}

/* service tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:var(--r);padding:16px;min-height:178px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background-size:cover;background-position:center}
.tile .ic{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.tile .ic svg{width:32px;height:32px}
.tile b{font-size:1.15rem;font-weight:800;line-height:1.2;display:block}
.tile small{font-size:.85rem;font-weight:600;opacity:.92}
.tile.electric{color:#1d1503}
.tile.electric .ic{background:rgba(0,0,0,.08)}
.tile .go{position:absolute;right:14px;top:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.tile.electric .go{background:rgba(0,0,0,.08)}
.tile .go svg{width:14px;height:14px}

/* offer */
.offer{background:var(--yellow);color:var(--on-yellow);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.offer .n{font-size:2.3rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.offer b{display:block;font-weight:800;font-size:1.05rem;line-height:1.25}
.offer span{font-size:.9rem;opacity:.8}

/* steps */
.steps{display:grid;gap:0;background:var(--card);border-radius:var(--r);padding:6px 16px}
.steps div{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;position:relative}
.steps div+div{border-top:1px solid var(--line)}
.steps i{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--bg);font-style:normal;font-weight:800;display:grid;place-items:center;font-size:1.05rem}
.steps b{display:block;font-weight:800;font-size:1.05rem;line-height:1.3}
.steps span{font-size:.92rem;color:var(--ink-2)}

/* promises */
.prom{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prom div{background:var(--card);border-radius:18px;padding:16px}
.prom svg{width:28px;height:28px;margin-bottom:10px;padding:5px;border-radius:9px;background:var(--bg)}
.prom b{display:block;font-weight:800;font-size:1rem;line-height:1.25}
.prom span{font-size:.86rem;color:var(--mute)}

/* share */
.share{background:#121316;color:#fff;border-radius:var(--r);padding:22px 18px;display:grid;gap:12px}
:root[data-theme="dark"] .share{background:var(--card)}
.share h3{font-size:1.4rem}
.share h3 em{font-style:normal;color:var(--yellow)}
.share p{color:#c9ccd3;font-size:.94rem}
.other{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink)}
.other .dot{width:50px;height:50px;border-radius:14px;background:#dcebd2;display:grid;place-items:center;font-size:1.6rem;flex:none}
.other b{display:block;font-weight:800;line-height:1.25}
.other span{font-size:.88rem;color:var(--mute)}

/* our work showcase */
.works{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1*max(18px,env(safe-area-inset-left,0px)));padding-inline:max(18px,env(safe-area-inset-left,0px));scroll-padding-inline:18px;scrollbar-width:none}
.works::-webkit-scrollbar{display:none}
.work{flex:0 0 86%;scroll-snap-align:start;background:var(--card);border-radius:var(--r);overflow:hidden;display:grid;align-content:start}
.work .sc,.svc .sc{aspect-ratio:400/260;overflow:hidden}
.work .wb{padding:16px;display:grid;gap:8px}
.work h3{font-size:1.3rem}
.work p{color:var(--ink-2);font-size:.95rem}
.work .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.work .row small{font-weight:700;font-size:.9rem}
.work .btn{padding:12px 18px;white-space:nowrap;flex:none}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:width .3s,background .3s}
.dots i.on{width:24px;background:var(--ink)}

/* page head */
.ph{display:grid;gap:6px;padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
.ph .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph h2{font-size:2.1rem}
.ph p{color:var(--ink-2);font-size:.95rem}
.ph .tbtn{color:var(--ink);border-color:var(--line)}

/* services page */
.svc{background:var(--card);border-radius:var(--r);overflow:hidden;scroll-margin-top:16px}
.svc .hd{display:flex;align-items:center;gap:14px;padding:18px;color:#fff;background-size:cover;background-position:center}
.svc .hd.electric{color:#1d1503}
.svc .hd .ic{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.svc .hd.electric .ic{background:rgba(0,0,0,.08)}
.svc .hd .ic svg{width:30px;height:30px}
.svc .hd h3{font-size:1.3rem}
.svc .hd small{display:block;font-weight:600;opacity:.9;font-size:.88rem}
.svc ul{list-style:none;margin:0;padding:4px 18px}
.svc li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:.96rem}
.svc li+li{border-top:1px solid var(--line)}
.svc li span:last-child{font-weight:700;white-space:nowrap}
.svc .ft{padding:0 18px 18px}

/* booking */
.form{display:grid;gap:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;display:grid;gap:16px}
.lbl,.fld>span{font-size:.9rem;font-weight:700;color:var(--ink-2)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick label{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;font-weight:700;font-size:.92rem;line-height:1.25}
.pick .pi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.pick .pi.electric{color:#1d1503}
.pick .pi svg{width:24px;height:24px}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){border-color:var(--ink);background:var(--bg)}
.pick label:has(input:focus-visible){outline:3px solid var(--yellow)}
.fld{display:grid;gap:6px}
.fld input,.fld select,.fld textarea{font:inherit;font-size:1.05rem;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:13px 14px;border-radius:14px;width:100%;min-width:0;appearance:none}
.fld select{background:var(--bg) linear-gradient(45deg,transparent 50%,var(--ink) 50%) right 20px center/6px 6px no-repeat,linear-gradient(-45deg,transparent 50%,var(--ink) 50%) right 14px center/6px 6px no-repeat;background-color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.seg.two-c{grid-template-columns:1fr 1fr}
.seg label{display:grid;place-items:center;text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:12px 4px;font-size:.92rem;font-weight:600;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.err{color:#d0342c;font-size:.92rem;font-weight:700}
.note{font-size:.9rem;color:var(--mute)}

/* account */
.list{background:var(--card);border-radius:var(--r);padding:0 16px}
.list>div{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:13px 0}
.list>div+div{border-top:1px solid var(--line)}
.list .i{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center}
.list .i svg{width:20px;height:20px}
.list b{display:block;font-size:.82rem;font-weight:600;color:var(--mute)}
.list span{font-weight:700;overflow-wrap:anywhere}
.sel{user-select:all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.req{padding:12px 0;display:grid}
.req+.req{border-top:1px solid var(--line)}
.req b{font-weight:800}
.req span{font-size:.88rem;color:var(--mute)}
.small{font-size:.86rem;color:var(--mute)}

/* bottom tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .bar{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center}
.nav button,.nav a{border:0;background:none;display:grid;place-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--mute);text-decoration:none;height:100%;align-content:center}
.nav svg{width:24px;height:24px}
.nav [aria-current="page"]{color:var(--ink)}
.nav [aria-current="page"] svg{background:var(--yellow);color:var(--on-yellow);border-radius:10px;padding:3px;width:36px;height:28px}
.nav .bk{position:relative}
.nav .bk .ring{width:58px;height:58px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;margin-top:-30px;box-shadow:0 8px 22px rgba(255,200,58,.45);border:4px solid var(--bg)}
.nav .bk .ring svg{width:26px;height:26px;background:none!important;padding:0!important}
.nav .bk[aria-current="page"] .ring{background:var(--ink);color:var(--bg);box-shadow:none}
.nav .bk[aria-current="page"] .ring svg{color:var(--bg)}
.nav a.wa{color:#1f9d55}

/* sheet + welcome */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding-top:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);justify-self:center}
.sheet h3{font-size:1.6rem}
.msg{white-space:pre-wrap;font-size:.86rem;background:var(--card);border-radius:14px;padding:12px;margin:0;max-height:200px;overflow:auto;font-family:var(--font)}
.welcome{position:fixed;inset:0;z-index:60;background:#121316;color:#fff;display:grid;place-items:center;padding:24px}
.wbox{width:100%;max-width:380px;display:grid;gap:14px;text-align:center;justify-items:center}
.wbox .logo{width:76px;height:76px;border-radius:22px}
.wbox .logo svg{width:40px;height:40px}
.wbox h2{font-size:2.6rem}
.wbox p{color:#c9ccd3}
.wbox .q{margin-top:10px;font-weight:700;color:#fff}
.wbox .btn{font-size:1.2rem;padding:18px}
.wbox .btn.ta{font-family:"Mukta Malar",sans-serif;font-size:1.35rem}
.wbox .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
/* animations: only when the phone allows motion */
@media (prefers-reduced-motion:no-preference){
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.82) translateY(14px)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-18px,22px) scale(1.08)}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,208,122,.6)}100%{box-shadow:0 0 0 10px rgba(58,208,122,0)}}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,200,58,.65),0 8px 22px rgba(255,200,58,.45)}100%{box-shadow:0 0 0 16px rgba(255,200,58,0),0 8px 22px rgba(255,200,58,.45)}}
  @keyframes bolt{0%,86%,100%{opacity:1;transform:none}89%{opacity:.25;transform:scale(.92)}93%{opacity:1;transform:scale(1.08)}}
  @keyframes drip{0%,55%{transform:translateY(0);opacity:1}100%{transform:translateY(6px);opacity:0}}
  @keyframes roll{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(320%) skewX(-20deg)}}
  @keyframes zero{0%{transform:scale(.4) rotate(-12deg);opacity:0}70%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:none}}

  .scrim:not([hidden]) .sheet{animation:up .3s cubic-bezier(.2,.8,.3,1)}
  main.view:not([hidden]){animation:viewIn .4s cubic-bezier(.2,.7,.2,1)}
  .hero>*:not(.top){opacity:0}
  .play .hero>*:not(.top){opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .hero .open{animation-delay:.05s}.hero h1{animation-delay:.14s}.hero .lead{animation-delay:.24s}.hero .chips{animation-delay:.32s}.hero .cta{animation-delay:.42s}
  .hero::after{animation:float 9s ease-in-out infinite}
  .hero .open i{animation:pulse 1.6s ease-out infinite}
  .hero .btn.y{position:relative;overflow:hidden}
  .hero .btn.y::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s ease-in-out 1.2s infinite}
  .tile{opacity:0}
  .play .tile{opacity:1;animation:pop .6s cubic-bezier(.2,.8,.3,1.15) backwards;transition:transform .15s}
  .tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}.tile:nth-child(4){animation-delay:.24s}
  .tile:active,.btn:active,.pick label:active,.seg label:active{transform:scale(.96)}
  .btn,.pick label,.seg label{transition:transform .12s,background-color .2s,border-color .2s}
  .tile.kitchen .ic svg,.svc .hd.kitchen .ic svg,.pick .pi.kitchen svg{animation:bob 3s ease-in-out infinite}
  .tile.electric .ic svg,.svc .hd.electric .ic svg,.pick .pi.electric svg{animation:bolt 3.4s ease-in-out infinite}
  .tile.plumb .ic svg path:nth-child(3),.svc .hd.plumb .ic svg path:nth-child(3),.pick .pi.plumb svg path:nth-child(3){transform-box:fill-box;animation:drip 1.8s ease-in infinite}
  .tile.paint .ic svg,.svc .hd.paint .ic svg,.pick .pi.paint svg{animation:roll 2.4s ease-in-out infinite}
  .tile .go{transition:transform .2s}.tile:hover .go{transform:translateX(3px)}
  .nav .bk .ring{animation:ring 2.2s ease-out infinite}
  .nav [aria-current="page"] svg{animation:pop .35s cubic-bezier(.2,.8,.3,1.3)}
  .offer.in .n{animation:zero .7s cubic-bezier(.2,.8,.3,1.2) .15s both}
  .rv{opacity:0;transform:translateY(26px);transition:opacity .65s ease,transform .65s cubic-bezier(.2,.7,.2,1)}
  .rv.in{opacity:1;transform:none}
  .steps.rv div,.prom.rv div{opacity:0;transform:translateX(-14px);transition:opacity .5s ease,transform .5s ease}
  .steps.rv.in div,.prom.rv.in div{opacity:1;transform:none}

<g fill="#14321f" opacity=".25"><circle cx="60" cy="236" r="4"/><circle cx="90" cy="240" r="3"/></g></svg>`
};
const SCENE_CSS=`
.scene{display:block;width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){
  .scene .swing{transform-origin:80px 0;animation:sc-swing 3.6s ease-in-out infinite}
  .scene .glow{animation:sc-glow 2.4s ease-in-out infinite}
  .scene .door{transform-origin:200px 191px;transform-box:view-box;animation:sc-door 4s ease-in-out infinite}
  .scene .steam{animation:sc-steam 2.4s ease-out infinite;opacity:0}
  .scene .s2{animation-delay:.6s}.scene .s3{animation-delay:1.2s}
  .scene .spin{transform-origin:120px 48px;animation:sc-spin 1.1s linear infinite}
  .scene .flow{animation:sc-flow .8s linear infinite}
  .scene .toggle{animation:sc-toggle 4s steps(1) infinite}
  .scene .spark path{transform-origin:84px 170px;transform-box:view-box;animation:sc-spark 2s ease-in-out infinite}
  .scene .stream{animation:sc-flow .5s linear infinite}
  .scene .drop{animation:sc-drop 1.2s ease-in infinite;opacity:0}
  .scene .d2{animation-delay:.6s}
  .scene .ripple{transform-origin:170px 176px;animation:sc-ripple 1.2s ease-out infinite}
  .scene .wrench{transform-origin:290px 194px;animation:sc-wrench 1.6s ease-in-out infinite}
  .scene .painted{transform-origin:150px 20px;animation:sc-paint 4s ease-in-out infinite}
  .scene .roll{animation:sc-roll 4s ease-in-out infinite}
  .scene .drip{animation:sc-drip 1.8s ease-in infinite}
}
@keyframes sc-swing{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}
@keyframes sc-glow{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes sc-door{0%,30%,100%{transform:scaleX(1)}50%,80%{transform:scaleX(.18)}}
@keyframes sc-steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-22px)}}
@keyframes sc-spin{to{transform:rotate(360deg)}}
@keyframes sc-flow{to{stroke-dashoffset:-28}}
@keyframes sc-toggle{0%{transform:translateY(0)}50%{transform:translateY(11px)}}
@keyframes sc-spark{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(-8deg)}}
@keyframes sc-drop{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:1;transform:translateY(56px)}}
@keyframes sc-ripple{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
@keyframes sc-wrench{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes sc-paint{0%,10%{transform:scaleY(0)}60%,90%{transform:scaleY(1)}100%{transform:scaleY(1)}}
@keyframes sc-roll{0%,10%{transform:translateY(0)}35%{transform:translateY(130px)}60%{transform:translateY(20px)}85%,100%{transform:translateY(0)}}
@keyframes sc-drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
`;

document.head.insertAdjacentHTML("beforeend","<style>"+SCENE_CSS+"</style>");
const DESC={
 kitchen:["Soft-close cabinets, granite top, loft and wardrobe.","மெதுவாக மூடும் அலமாரி, கிரானைட் மேடை, லாஃப்ட், வார்ட்ரோப்."],
 electric:["Wiring, fans, lights and switch boards. Safe and neat.","வயரிங், ஃபேன், லைட், சுவிட்ச் போர்டு. பாதுகாப்பாக, நேர்த்தியாக."],
 plumb:["Taps, leaks, water tanks and motor lines fixed fast.","குழாய், கசிவு, தண்ணீர் தொட்டி, மோட்டார் லைன் விரைவாக சரிசெய்வோம்."],
 paint:["Inside and outside walls, putty and waterproofing.","உள், வெளி சுவர், புட்டி, நீர்ப்புகா பூச்சு."]
};
const desc=id=>DESC[id]?DESC[id][lang==="ta"?1:0]:"";
const bg=id=>PHOTOS[id]?`background-image:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.55)),url('${PHOTOS[id]}');background-color:var(--${id})`:`background-color:var(--${id})`;
const ARR=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>`;

const store={get(k,d){try{const v=localStorage.getItem("ms_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("ms_"+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("lang","en"),tab="home",picked="kitchen";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const t=k=>T[lang][k],nm=o=>lang==="ta"?o.ta:o.en;
const wa=m=>"https://wa.me/"+SHOP.phone+"?text="+encodeURIComponent(m);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  $("#tiles").innerHTML=SVC.map(s=>`<button class="tile ${s.id}" type="button" data-svc="${s.id}" style="${bg(s.id)}"><span class="ic">${ICO[s.id]}</span><span class="go">${ARR}</span><span><b>${nm(s)}</b><small>${t("fromL")} ${s.from}</small></span></button>`).join("");
  $("#works").innerHTML=SVC.map((s,i)=>`<article class="work"><div class="sc">${SCENE[s.id]||""}</div><div class="wb"><span class="tag" style="color:var(--${s.id})">0${i+1} · ${t("workK")}</span><h3>${nm(s)}</h3><p>${desc(s.id)}</p><div class="row"><small>${t("fromL")} ${s.from}</small><button class="btn y" type="button" data-bookfor="${s.id}">${t("book")}</button></div></div></article>`).join("");
  $("#dots").innerHTML=SVC.map((s,i)=>`<i class="${i?"":"on"}"></i>`).join("");
  $("#svclist").innerHTML=SVC.map(s=>`<article class="svc rv" id="s-${s.id}"><div class="sc">${SCENE[s.id]||""}</div><div class="hd ${s.id}" style="${bg(s.id)}"><span class="ic">${ICO[s.id]}</span><div><h3>${nm(s)}</h3><small>${t("fromL")} ${s.from}</small></div></div>
   <ul>${s.items.map(x=>`<li><span>${lang==="ta"?x[1]:x[0]}</span><span>${x[2]}</span></li>`).join("")}</ul>
   <div class="ft"><button class="btn y block" type="button" data-bookfor="${s.id}"><span>${t("book")}</span>${ARR}</button></div></article>`).join("");
  $("#pick").innerHTML=SVC.map(s=>`<label><input type="radio" name="svc" value="${s.id}" ${s.id===picked?"checked":""}><span class="pi ${s.id}" style="background:var(--${s.id})">${ICO[s.id]}</span>${nm(s)}</label>`).join("");
  fillWork();
  const r=store.get("reqs",[]);
  $("#reqs").innerHTML=r.length?r.slice().reverse().map(x=>`<div class="req"><b>${esc(x.svc)}</b><span>${esc(x.work)} · ${esc(x.when)}</span></div>`).join(""):`<p class="note" style="padding:14px 0">${t("noReq")}</p>`;
  reveal();
  const d=store.get("me",{});
  if(d.name&&!$("#b-name").value)$("#b-name").value=d.name;
  if(d.phone&&!$("#b-phone").value)$("#b-phone").value=d.phone;
}
/* show sections with a soft slide when they scroll into view */
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12}):null;
function reveal(){$$(".rv:not(.in)").forEach(el=>io?io.observe(el):el.classList.add("in"))}
function fillWork(){
  const s=SVC.find(x=>x.id===picked);
  $("#b-work").innerHTML=s.items.map((i,n)=>`<option value="${n}">${lang==="ta"?i[1]:i[0]}</option>`).join("")+`<option value="other">${t("other")}</option>`;
}
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-t]").forEach(e=>{const v=t(e.dataset.t);if(typeof v==="string")e.textContent=v});
  $("#heroH").innerHTML=t("heroHtml");$("#shareH").innerHTML=t("shareHtml");
  $("#lang").textContent=lang==="en"?"தமிழ்":"EN";
  $$("[name=s-lang]").forEach(i=>i.checked=i.value===lang);
  $("#phoneLine").textContent=SHOP.phoneShow;$("#emailLine").textContent=SHOP.email;
  $$("a[href^='tel:']").forEach(a=>a.href="tel:+"+SHOP.phone);
  $("#waHello").href=wa("Vanakkam Meenthulli Home Services!");$("#fab").href=$("#waHello").href;
  $("#promo").href=SHOP.otherApp;
  $("#offerLine").textContent=lang==="ta"?SHOP.offerTa:SHOP.offerEn;
  render();
}
function go(v){tab=v;document.body.dataset.tab=v;$$(".view[id^='v-']").forEach(e=>e.hidden=e.id!=="v-"+v);$$(".nav button").forEach(b=>{if(b.dataset.tab===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});window.scrollTo(0,0)}
function sheet(h){$("#sheet").innerHTML=`<div class="grab"></div>`+h;$("#scrim").hidden=false;$("#sheet a,#sheet button")?.focus()}
document.addEventListener("click",e=>{
  if(e.target.id==="scrim"){$("#scrim").hidden=true;return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab)return go(b.dataset.tab);
  if(b.dataset.goto)return go(b.dataset.goto);
  if(b.dataset.svc){go("services");document.getElementById("s-"+b.dataset.svc).scrollIntoView({block:"start"});return}
  if(b.dataset.bookfor){picked=b.dataset.bookfor;render();return go("book")}
  if(b.hasAttribute("data-share")){const m=t("shareMsg")+" "+SHOP.shareUrl;if(navigator.share){navigator.share({text:m}).catch(()=>{})}else{location.href="https://wa.me/?text="+encodeURIComponent(m)}return}
  if(b.hasAttribute("data-close"))$("#scrim").hidden=true;
});
document.addEventListener("change",e=>{if(e.target.name==="svc"){picked=e.target.value;fillWork()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#scrim").hidden=true});
function applyTheme(v){if(v==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;$$("[name=s-theme]").forEach(i=>i.checked=i.value===v)}
applyTheme(store.get("theme","auto"));
$$("[name=s-theme]").forEach(i=>i.onchange=()=>{store.set("theme",i.value);applyTheme(i.value)});
$$("[name=s-lang]").forEach(i=>i.onchange=()=>{lang=i.value;store.set("lang",lang);applyLang()});
$("#clearMe").onclick=()=>{store.set("me",{});store.set("reqs",[]);try{$("#b-name").value="";$("#b-phone").value=""}catch(e){}render();$("#clearDone").hidden=false};
$("#lang").onclick=()=>{lang=lang==="en"?"ta":"en";store.set("lang",lang);applyLang()};
$("#book").addEventListener("submit",e=>{
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const name=v("b-name"),phone=v("b-phone").replace(/\D/g,"");
  if(!name||phone.length!==10){const er=$("#b-err");er.textContent=t("fill");er.hidden=false;return}
  $("#b-err").hidden=true;
  store.set("me",{name,phone});
  const s=SVC.find(x=>x.id===picked),wi=v("b-work"),work=wi==="other"?"Other work":s.items[+wi][0];
  const tm=document.querySelector("[name=tm]:checked").value,date=v("b-date")||"Any day";
  const msg=`Vanakkam Meenthulli Home Services! Free visit booking 🛠️\n\nService: ${s.en} (${s.ta})\nWork: ${work}\nName: ${name}\nPhone: ${phone}\nArea: ${v("b-area")}\nDate: ${date}, ${tm}\nDetails: ${v("b-note")||"-"}`;
  const r=store.get("reqs",[]);r.push({svc:nm(s),work,when:date+", "+tm});store.set("reqs",r.slice(-20));
  render();
  sheet(`<span class="tag">${t("bookK")}</span><h3>${t("sentT")}</h3><p class="note">${t("sentP")}</p><pre class="msg">${esc(msg)}</pre><a class="btn wa block" href="${wa(msg)}" target="_blank" rel="noopener">${t("openWa")}</a><p class="note" style="text-align:center">${SHOP.phoneShow}</p><button class="btn ghost block" type="button" data-close>${t("close")}</button>`);
});
/* showcase: dots follow the swipe, and it moves on by itself every few seconds until the person touches it */
const works=$("#works");let wi=0,touched=false;
works.addEventListener("scroll",()=>{const c=works.children[0];if(!c)return;wi=Math.round(works.scrollLeft/(c.offsetWidth+14));$$("#dots i").forEach((d,i)=>d.classList.toggle("on",i===wi))},{passive:true});
["pointerdown","touchstart"].forEach(ev=>works.addEventListener(ev,()=>touched=true,{passive:true}));
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)setInterval(()=>{if(touched||tab!=="home"||document.hidden||!$("#welcome").hidden)return;const n=(wi+1)%works.children.length,c=works.children[n];works.scrollTo({left:c.offsetLeft-works.children[0].offsetLeft,behavior:"smooth"})},4500);
let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#installBtn").hidden=true};
try{if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]'))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
const firstOpen=store.get("lang",null)===null;
$$("[data-wl]").forEach(b=>b.onclick=()=>{lang=b.dataset.wl;store.set("lang",lang);applyLang();$("#welcome").hidden=true;$("#v-home").classList.add("play")});
applyLang();go("home");
if(firstOpen)$("#welcome").hidden=false;else $("#v-home").classList.add("play");
</script>
</body></html>

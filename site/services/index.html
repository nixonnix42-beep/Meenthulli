};
const store={get(k,d){try{const v=localStorage.getItem("ms_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("ms_"+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("lang","en"),tab="home",picked="kitchen";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const t=k=>T[lang][k],nm=o=>lang==="ta"?o.ta:o.en;
const wa=m=>"https://wa.me/"+SHOP.phone+"?text="+encodeURIComponent(m);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  $("#tiles").innerHTML=SVC.map(s=>`<button class="tile" type="button" data-svc="${s.id}" style="background:var(${s.tint})"><span aria-hidden="true">${s.ico}</span>${nm(s)}</button>`).join("");
  $("#svclist").innerHTML=SVC.map(s=>`<div class="svc" id="s-${s.id}"><div class="head"><div class="art" style="background:var(${s.tint})" aria-hidden="true">${s.ico}</div><div><h3>${nm(s)}</h3><div class="ta">${lang==="ta"?s.en:s.ta}</div><div class="from">${t("from")} <b>${s.from}</b></div></div></div>
   <ul>${s.items.map(i=>`<li><span>${lang==="ta"?i[1]:i[0]}</span><span>${i[2]}</span></li>`).join("")}</ul>
   <div class="foot"><button class="btn block" type="button" data-bookfor="${s.id}">${t("book")}</button></div></div>`).join("");
  $("#pick").innerHTML=SVC.map(s=>`<label><input type="radio" name="svc" value="${s.id}" ${s.id===picked?"checked":""}><span aria-hidden="true">${s.ico}</span>${nm(s)}</label>`).join("");
  fillWork();
  const r=store.get("reqs",[]);
  $("#reqs").innerHTML=r.length?r.slice().reverse().map(x=>`<div class="req"><b>${esc(x.svc)}</b><span class="hint">${esc(x.work)} · ${esc(x.when)}</span></div>`).join(""):`<p class="hint">${t("noReq")}</p>`;
  const d=store.get("me",{});
  if(d.name&&!$("#b-name").value)$("#b-name").value=d.name;
  if(d.phone&&!$("#b-phone").value)$("#b-phone").value=d.phone;
}
function fillWork(){
  const s=SVC.find(x=>x.id===picked);
  $("#b-work").innerHTML=s.items.map((i,n)=>`<option value="${n}">${lang==="ta"?i[1]:i[0]}</option>`).join("")+`<option value="other">${t("other")}</option>`;
}
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-t]").forEach(e=>{const v=t(e.dataset.t);if(typeof v==="string")e.textContent=v});
  $("#lang").textContent=lang==="en"?"தமிழ்":"EN";
  $("#ownerLine").textContent=SHOP.owner;$("#phoneLine").textContent=SHOP.phoneShow;$("#emailLine").textContent=SHOP.email;
  $$("a[href^='tel:']").forEach(a=>a.href="tel:+"+SHOP.phone);
  $("#waHello").href=wa("Vanakkam Meenthulli Home Services!");
  $("#promo").href=SHOP.otherApp;
  render();
}
function go(v){tab=v;$$(".view").forEach(e=>e.hidden=e.id!=="v-"+v);$$(".nav button").forEach(b=>{if(b.dataset.tab===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});window.scrollTo(0,0)}
function sheet(h){$("#sheet").innerHTML=`<div class="grab"></div>`+h;$("#scrim").hidden=false;$("#sheet a,#sheet button")?.focus()}
document.addEventListener("click",e=>{
  if(e.target.id==="scrim"){$("#scrim").hidden=true;return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab)return go(b.dataset.tab);
  if(b.dataset.goto)return go(b.dataset.goto);
  if(b.dataset.svc){go("services");document.getElementById("s-"+b.dataset.svc).scrollIntoView({block:"start"});return}
  if(b.dataset.bookfor){picked=b.dataset.bookfor;render();return go("book")}
  if(b.hasAttribute("data-close"))$("#scrim").hidden=true;
});
document.addEventListener("change",e=>{if(e.target.name==="svc"){picked=e.target.value;fillWork()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#scrim").hidden=true});
$("#lang").onclick=()=>{lang=lang==="en"?"ta":"en";store.set("lang",lang);applyLang()};
$("#book").addEventListener("submit",e=>{
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const name=v("b-name"),phone=v("b-phone").replace(/\D/g,"");
  if(!name||phone.length!==10){const er=$("#b-err");er.textContent=t("fill");er.hidden=false;return}
  $("#b-err").hidden=true;
  store.set("me",{name,phone});
  const s=SVC.find(x=>x.id===picked),wi=v("b-work"),work=wi==="other"?"Other work":s.items[+wi][0];
  const tm=document.querySelector("[name=tm]:checked").value,date=v("b-date")||"Any day";
  const msg=`Vanakkam Meenthulli Home Services! Free visit booking 🛠️\n\nService: ${s.en} (${s.ta})\nWork: ${work}\nName: ${name}\nPhone: ${phone}\nArea: ${v("b-area")}\nDate: ${date}, ${tm}\nDetails: ${v("b-note")||"-"}`;
  const r=store.get("reqs",[]);r.push({svc:nm(s),work,when:date+", "+tm});store.set("reqs",r.slice(-20));
  render();
  sheet(`<h3>${t("sentT")}</h3><p class="hint">${t("sentP")}</p><pre class="msg">${esc(msg)}</pre><a class="btn alt block" href="${wa(msg)}" target="_blank" rel="noopener">${t("openWa")}</a><p class="hint" style="text-align:center">${SHOP.phoneShow}</p><button class="btn ghost block" type="button" data-close>${t("close")}</button>`);
});
let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#installBtn").hidden=true};
try{if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]'))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
applyLang();go("home");
</script>
</body></html>

<style>
/* Layout: "atelier" app. Full-bleed illustrated hero, swipeable portrait service cards, editorial numbered sections, hairline rules, floating pill nav */
:root{

:root[data-theme="dark"]{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:12px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px)}

.view{display:grid;gap:44px;padding-block:6px 10px}

.btn.gold{background:var(--gold);color:#1c1406}

.prom div:nth-child(odd){border-right:1px solid var(--rule)}

.prom svg{width:26px;height:26px;color:var(--gold);margin-bottom:8px}

.fld>span,.lbl{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500}

.seg.two-c{grid-template-columns:1fr 1fr}
.set .lbl{margin-top:18px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500}

.set .small{font-size:.85rem;margin:10px 0 0;color:var(--mute)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.seg label{display:grid;place-items:center;border:1px solid var(--rule);border-radius:999px;padding:10px 4px;font-size:.88rem;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}

/* account */
.rows{display:grid}
.rows div{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--rule)}
.rows div:last-child{border-bottom:1px solid var(--rule)}
.rows svg{width:20px;height:20px;color:var(--gold);margin-top:3px}
.rows b{display:block;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500}
:lang(ta) .rows b{letter-spacing:.02em;text-transform:none;font-size:.85rem}
.rows span{font-family:var(--serif);font-size:1.25rem;font-weight:600;overflow-wrap:anywhere}
.sel{user-select:all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.req{padding:12px 0;border-top:1px solid var(--rule);display:grid}
.req b{font-family:var(--serif);font-size:1.15rem}
.req span{font-size:.85rem;color:var(--mute)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:20;display:flex;justify-content:center;pointer-events:none;padding-inline:max(20px,env(safe-area-inset-left,0px))}
.nav .bar{pointer-events:auto;width:100%;max-width:420px;background:var(--navy);border-radius:999px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 14px 34px rgba(28,35,51,.28)}
.nav button{border:0;background:none;height:calc(var(--nav-h) - 12px);border-radius:999px;display:grid;place-items:center;align-content:center;gap:1px;font-size:.66rem;letter-spacing:.06em;color:#9aa0ad}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{background:var(--gold);color:#1c1406}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:28px 28px 0 0;max-height:88vh;overflow:auto;padding-top:14px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet .grab{width:44px;height:4px;border-radius:9px;background:var(--rule);justify-self:center}

@media (prefers-reduced-motion:no-preference){
  .scrim:not([hidden]) .sheet{animation:up .25s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .view:not([hidden]){animation:fade .35s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .btn:active,.scard:active{transform:scale(.98)}
}
</style></head><body>

paint:`<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"><rect width="400" height="500" fill="#dfe3ee"/><rect x="0" y="0" width="220" height="430" fill="#c8a98a"/><path d="M220 0c-10 60 10 120 0 180s10 120 0 250" stroke="#c8a98a" stroke-width="14" fill="none"/><g transform="translate(218 210) rotate(-24)"><rect x="0" y="0" width="110" height="34" rx="10" fill="#c8a98a" stroke="#1c2333" stroke-width="2.5"/><path d="M110 17h18v46H60v26" fill="none" stroke="#1c2333" stroke-width="6" stroke-linejoin="round"/><rect x="50" y="88" width="20" height="70" rx="6" fill="#1c2333"/></g><path d="M300 270l40 160M360 270l-20 160" stroke="#1c2333" stroke-width="3"/><path d="M314 320h38M322 360h28M330 400h18" stroke="#1c2333" stroke-width="3"/><rect x="40" y="380" width="70" height="60" rx="6" fill="#fbf7f0" stroke="#1c2333" stroke-width="2.5"/><path d="M40 395h70" stroke="#1c2333" stroke-width="2.5"/><path d="M60 380c0-14 30-14 30 0" fill="none" stroke="#1c2333" stroke-width="2.5"/><rect x="0" y="430" width="400" height="70" fill="#cdd3e2"/></svg>`
};
const pic=id=>PHOTOS[id]?`<img src="${PHOTOS[id]}" alt="" loading="lazy">`:SCN[id];
const ARR=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10M9 4l4 4-4 4"/></svg>`;

const store={get(k,d){try{const v=localStorage.getItem("ms_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("ms_"+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("lang","en"),tab="home",picked="kitchen";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const t=k=>T[lang][k],nm=o=>lang==="ta"?o.ta:o.en;
const wa=m=>"https://wa.me/"+SHOP.phone+"?text="+encodeURIComponent(m);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const two=n=>String(n+1).padStart(2,"0");

function render(){
  $("#heroPic").insertAdjacentHTML("afterbegin","");
  const hp=$("#heroPic");[...hp.children].forEach(c=>{if(!c.classList.contains("badge"))c.remove()});hp.insertAdjacentHTML("afterbegin",pic("hero"));
  $("#rail").innerHTML=SVC.map((s,i)=>`<button class="scard" type="button" data-svc="${s.id}"><div class="pic">${pic(s.id)}<span class="no">${two(i)}</span></div><h3>${nm(s)}</h3><div class="meta"><span>${t("fromL")} <b>${s.from}</b></span><span class="arr">${ARR}</span></div></button>`).join("");
  $("#svclist").innerHTML=SVC.map((s,i)=>`<article class="svc" id="s-${s.id}"><div class="pic">${pic(s.id)}</div><div class="head"><div><div class="eyebrow">${two(i)}</div><h3>${nm(s)}</h3><div class="ta">${lang==="ta"?s.en:s.ta}</div></div><div class="from">${t("fromL")}<b>${s.from}</b></div></div>
   <ul>${s.items.map(x=>`<li><span>${lang==="ta"?x[1]:x[0]}</span><span>${x[2]}</span></li>`).join("")}</ul>
   <button class="btn block" type="button" data-bookfor="${s.id}"><span>${t("book")}</span>${ARR}</button></article>`).join("");
  $("#pick").innerHTML=SVC.map(s=>`<label><input type="radio" name="svc" value="${s.id}" ${s.id===picked?"checked":""}><span class="pi">${SCN[s.id]}</span>${nm(s)}</label>`).join("");
  fillWork();
  const r=store.get("reqs",[]);
  $("#reqs").innerHTML=r.length?r.slice().reverse().map(x=>`<div class="req"><b>${esc(x.svc)}</b><span>${esc(x.work)} · ${esc(x.when)}</span></div>`).join(""):`<p class="note">${t("noReq")}</p>`;
  const d=store.get("me",{});
  if(d.name&&!$("#b-name").value)$("#b-name").value=d.name;
  if(d.phone&&!$("#b-phone").value)$("#b-phone").value=d.phone;
}
function fillWork(){
  const s=SVC.find(x=>x.id===picked);
  $("#b-work").innerHTML=s.items.map((i,n)=>`<option value="${n}">${lang==="ta"?i[1]:i[0]}</option>`).join("")+`<option value="other">${t("other")}</option>`;
}
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-t]").forEach(e=>{const v=t(e.dataset.t);if(typeof v==="string")e.textContent=v});
  $("#heroH").innerHTML=t("heroHtml");$("#shareH").innerHTML=t("shareHtml");
  $("#lang").textContent=lang==="en"?"தமிழ்":"EN";
  $$("[name=s-lang]").forEach(i=>i.checked=i.value===lang);
  $("#ownerLine").textContent=SHOP.owner;$("#phoneLine").textContent=SHOP.phoneShow;$("#emailLine").textContent=SHOP.email;
  $$("a[href^='tel:']").forEach(a=>a.href="tel:+"+SHOP.phone);
  $("#waHello").href=wa("Vanakkam Meenthulli Home Services!");
  $("#promo").href=SHOP.otherApp;
  $("#offerLine").textContent=lang==="ta"?SHOP.offerTa:SHOP.offerEn;
  render();
}
function go(v){tab=v;$$(".view[id^='v-']").forEach(e=>e.hidden=e.id!=="v-"+v);$$(".nav button").forEach(b=>{if(b.dataset.tab===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});window.scrollTo(0,0)}
function sheet(h){$("#sheet").innerHTML=`<div class="grab"></div>`+h;$("#scrim").hidden=false;$("#sheet a,#sheet button")?.focus()}
document.addEventListener("click",e=>{
  if(e.target.id==="scrim"){$("#scrim").hidden=true;return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab)return go(b.dataset.tab);
  if(b.dataset.goto)return go(b.dataset.goto);
  if(b.dataset.svc){go("services");document.getElementById("s-"+b.dataset.svc).scrollIntoView({block:"start"});return}
  if(b.dataset.bookfor){picked=b.dataset.bookfor;render();return go("book")}
  if(b.hasAttribute("data-share")){const m=t("shareMsg")+" "+SHOP.shareUrl;if(navigator.share){navigator.share({text:m}).catch(()=>{})}else{location.href="https://wa.me/?text="+encodeURIComponent(m)}return}
  if(b.hasAttribute("data-close"))$("#scrim").hidden=true;
});
document.addEventListener("change",e=>{if(e.target.name==="svc"){picked=e.target.value;fillWork()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#scrim").hidden=true});
function applyTheme(v){if(v==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;$$("[name=s-theme]").forEach(i=>i.checked=i.value===v)}
applyTheme(store.get("theme","auto"));
$$("[name=s-theme]").forEach(i=>i.onchange=()=>{store.set("theme",i.value);applyTheme(i.value)});
$$("[name=s-lang]").forEach(i=>i.onchange=()=>{lang=i.value;store.set("lang",lang);applyLang()});
$("#clearMe").onclick=()=>{store.set("me",{});store.set("reqs",[]);try{$("#b-name").value="";$("#b-phone").value=""}catch(e){}render();$("#clearDone").hidden=false};
$("#lang").onclick=()=>{lang=lang==="en"?"ta":"en";store.set("lang",lang);applyLang()};
$("#book").addEventListener("submit",e=>{
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const name=v("b-name"),phone=v("b-phone").replace(/\D/g,"");
  if(!name||phone.length!==10){const er=$("#b-err");er.textContent=t("fill");er.hidden=false;return}
  $("#b-err").hidden=true;
  store.set("me",{name,phone});
  const s=SVC.find(x=>x.id===picked),wi=v("b-work"),work=wi==="other"?"Other work":s.items[+wi][0];
  const tm=document.querySelector("[name=tm]:checked").value,date=v("b-date")||"Any day";
  const msg=`Vanakkam Meenthulli Home Services! Free visit booking 🛠️\n\nService: ${s.en} (${s.ta})\nWork: ${work}\nName: ${name}\nPhone: ${phone}\nArea: ${v("b-area")}\nDate: ${date}, ${tm}\nDetails: ${v("b-note")||"-"}`;
  const r=store.get("reqs",[]);r.push({svc:nm(s),work,when:date+", "+tm});store.set("reqs",r.slice(-20));
  render();
  sheet(`<div class="eyebrow">${t("bookK")}</div><h3>${t("sentT")}</h3><p class="note">${t("sentP")}</p><pre class="msg">${esc(msg)}</pre><a class="btn wa block" href="${wa(msg)}" target="_blank" rel="noopener">${t("openWa")}</a><p class="note" style="text-align:center">${SHOP.phoneShow}</p><button class="btn line block" type="button" data-close>${t("close")}</button>`);
});
let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#installBtn").hidden=true};
try{if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]'))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
applyLang();go("home");
</script>
</body></html>

:root[data-theme="dark"]{

   <div class="sum"><span>${t("delivery")}</span><span class="${fee?"":"ok"}">${fee?"₹"+fee:t("free")}</span></div>
   ${fee?`<div class="hint">${t("addMore")(SHOP.freeAbove-sub)}</div>`:""}
   <div class="sum tot"><span>${t("total")}</span><span>₹${total}</span></div></div>
  <form class="form" id="checkout" novalidate>
   <h3>${t("details")}</h3>
   <label class="fld" for="c-name"><span>${t("name")}</span><input id="c-name" autocomplete="name" value="${esc(d.name)}"></label>
   <label class="fld" for="c-phone"><span>${t("phone")}</span><input id="c-phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" value="${esc(d.phone)}"></label>
   <label class="fld" for="c-addr"><span>${t("address")}</span><textarea id="c-addr" rows="2" autocomplete="street-address">${esc(d.address)}</textarea></label>
   <div><div class="lbl">${t("slot")}</div><div class="seg"><label><input type="radio" name="slot" value="morning" ${d.slot!=="evening"?"checked":""}>${t("morning")}</label><label><input type="radio" name="slot" value="evening" ${d.slot==="evening"?"checked":""}>${t("evening")}</label></div></div>
   <div><div class="lbl">${t("pay")}</div><div class="seg"><label><input type="radio" name="pay" value="cod" ${d.pay!=="upi"?"checked":""}>${t("cod")}</label><label><input type="radio" name="pay" value="upi" ${d.pay==="upi"?"checked":""}>${t("upi")}</label></div></div>
   <label class="fld" for="c-note"><span>${t("note")}</span><input id="c-note"></label>
   <div class="err" id="c-err" hidden></div>
   <button class="btn wa block" type="submit">${t("place2")} · ₹${total}</button>
  </form>`;
}
function renderOrders(){
  const o=store.get("orders",[]);
  $("#orders").innerHTML=o.length?o.slice().reverse().map(x=>`<div class="order"><div><span>${esc(x.when)}</span><span>₹${x.total}</span></div><span class="hint">${esc(x.items)}</span></div>`).join(""):`<p class="hint">${t("noOrders")}</p>`;
}
function refreshBadges(){
  const {count,total}=totals();
  document.body.classList.toggle("has-cart",!!count);
  $("#badge").hidden=!count;$("#badge").textContent=count;
  $("#pill").hidden=!count||tab==="cart"||tab==="more";
  $("#pillN").textContent=t("items")(count);$("#pillT").textContent="₹"+total;
  store.set("cart",cart);
}
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-t]").forEach(e=>{const v=t(e.dataset.t);if(typeof v==="string")e.textContent=v});
  $$("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  $("#heroH").innerHTML=t("heroHtml");$("#shareH").innerHTML=t("shareHtml");
  $("#lang").textContent=lang==="en"?"தமிழ்":"EN";
  $$("[name=s-lang]").forEach(i=>i.checked=i.value===lang);
  $("#ownerLine").textContent=SHOP.owner;$("#emailLine").textContent=SHOP.email;$("#phoneLine").textContent=SHOP.phoneShow;
  $("#promo").href=SHOP.otherApp;
  $$("a[href^='tel:']").forEach(a=>a.href="tel:+"+SHOP.phone);
  const hi=wa(lang==="ta"?"வணக்கம் மீன்துள்ளி!":"Vanakkam Meenthulli!");
  $("#waHello").href=hi;$("#waHero").href=hi;$("#fab").href=hi;
  renderAll();
}
function renderAll(){renderHome();renderShop();renderCart();renderOrders();refreshBadges()}
function go(v){
  tab=v;document.body.dataset.tab=v;
  $$(".view").forEach(e=>e.hidden=e.id!=="v-"+v);
  $$(".nav button").forEach(b=>{if(b.dataset.tab===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(v==="cart")renderCart();if(v==="more")renderOrders();
  refreshBadges();window.scrollTo(0,0);
}
let toastT;
function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,1400)}
function sheet(html){$("#sheet").innerHTML=`<div class="grab"></div>`+html;$("#scrim").hidden=false;const f=$("#sheet").querySelector("input,button");f&&f.focus()}
function closeSheet(){$("#scrim").hidden=true}
function sentSheet(msg){
  sheet(`<h3>${t("sentT")}</h3><p class="hint">${t("sentP")}</p><pre class="msg">${esc(msg)}</pre>
   <a class="btn wa block" href="${wa(msg)}" target="_blank" rel="noopener">${t("openWa")}</a>
   <p class="hint" style="text-align:center">${SHOP.phoneShow}</p>
   <button class="btn line block" type="button" data-close>${t("close")}</button>`);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a");
  if(e.target.id==="scrim"){closeSheet();return}
  if(!b)return;
  if(b.dataset.tab)return go(b.dataset.tab);
  if(b.dataset.goto)return go(b.dataset.goto);
  if(b.dataset.cat){cat=b.dataset.cat;renderShop();return go("shop")}
  if(b.dataset.chip){cat=b.dataset.chip;return renderShop()}
  if(b.hasAttribute("data-share")){const m=t("shareMsg")+" "+SHOP.shareUrl;if(navigator.share){navigator.share({text:m}).catch(()=>{})}else{location.href="https://wa.me/?text="+encodeURIComponent(m)}return}
  if(b.hasAttribute("data-close"))return closeSheet();
  if(b.dataset.d){
    const id=b.dataset.id, was=cart[id]||0;
    cart[id]=Math.max(0,was+Number(b.dataset.d));
    if(!cart[id])delete cart[id];
    if(!was)toast(t("added"));
    const p=P.find(x=>x.id===id);
    $$(`[data-slot="${id}"]`).forEach(s=>s.innerHTML=stepper(p));
    if(tab==="cart")renderCart();
    refreshBadges();
  }
});
$("#lang").onclick=()=>{lang=lang==="en"?"ta":"en";store.set("lang",lang);applyLang()};
function applyTheme(v){if(v==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;$$("[name=s-theme]").forEach(i=>i.checked=i.value===v)}
applyTheme(store.get("theme","auto"));
$$("[name=s-theme]").forEach(i=>i.onchange=()=>{store.set("theme",i.value);applyTheme(i.value)});
$$("[name=s-lang]").forEach(i=>i.onchange=()=>{lang=i.value;store.set("lang",lang);applyLang()});
$("#clearMe").onclick=()=>{store.set("addr",{});store.set("orders",[]);cart={};renderAll();$("#clearDone").hidden=false};
["#q1","#q2"].forEach(s=>$(s).addEventListener("input",e=>{query=e.target.value;$("#q1").value=$("#q2").value=query;renderShop();if(tab!=="shop"){go("shop");$("#q2").focus()}}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const v=id=>(document.getElementById(id)?.value||"").trim();
  if(e.target.id==="checkout"){
    const name=v("c-name"),phone=v("c-phone").replace(/\D/g,""),address=v("c-addr");
    const slot=document.querySelector('[name=slot]:checked').value,pay=document.querySelector('[name=pay]:checked').value;
    if(!name||phone.length!==10||!address){const er=$("#c-err");er.textContent=t("fill");er.hidden=false;return}
    store.set("addr",{name,phone,address,slot,pay});
    const {items,sub,fee,total}=totals();
    const msg=`Vanakkam Meenthulli Fresh! New order 🛒\n\n`+items.map(p=>`• ${p.en} (${p.ta}) × ${cart[p.id]} ${p.unit} = ₹${p.price*cart[p.id]}`).join("\n")+
      `\n\nItems: ₹${sub}\nDelivery: ${fee?"₹"+fee:"Free"}\nTotal: ₹${total}\n\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\nTime: ${slot==="evening"?"Evening 5–8":"Morning 7–10"}\nPayment: ${pay==="upi"?"UPI":"Cash"} on delivery`+(v("c-note")?`\nNote: ${v("c-note")}`:"");
    const o=store.get("orders",[]);
    o.push({when:new Date().toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}),total,items:items.map(p=>`${nm(p)} × ${cart[p.id]}`).join(", ")});
    store.set("orders",o.slice(-20));
    cart={};refreshBadges();renderCart();renderShop();renderHome();
    sentSheet(msg);
  }
});
// install button, works when the site is hosted as an app
let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#installBtn").hidden=true};
try{if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]'))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
// Load products from Google Sheet if set (columns: id,category,name_en,name_ta,unit_en,unit_ta,price,emoji,fresh,available)
function parseCSV(txt){const rows=[];let r=[],c="",q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows}
async function loadSheet(){
  if(!SHOP.sheetCSV)return;
  try{
    const rows=parseCSV(await (await fetch(SHOP.sheetCSV,{cache:"no-store"})).text());
    const h=rows.shift().map(x=>x.trim().toLowerCase());const g=(r,k)=>(r[h.indexOf(k)]||"").trim();
    const list=rows.filter(r=>g(r,"name_en")&&!/^(no|n|0)$/i.test(g(r,"available"))).map((r,i)=>({id:g(r,"id")||"s"+i,cat:CATS.some(c=>c.id===g(r,"category"))?g(r,"category"):"healthy",en:g(r,"name_en"),ta:g(r,"name_ta")||g(r,"name_en"),unit:g(r,"unit_en")||"each",uta:g(r,"unit_ta")||g(r,"unit_en")||"ஒன்று",price:Number(g(r,"price"))||0,ico:g(r,"emoji")||"🛒",custom:!!g(r,"emoji"),tag:/^(yes|y|1)$/i.test(g(r,"fresh"))}));
    if(list.length){P.length=0;P.push(...list);Object.keys(cart).forEach(k=>{if(!P.some(p=>p.id===k))delete cart[k]});renderAll()}
  }catch(e){}
}
const firstOpen=store.get("lang",null)===null;
$$("[data-wl]").forEach(b=>b.onclick=()=>{lang=b.dataset.wl;store.set("lang",lang);applyLang();$("#welcome").hidden=true});
applyLang();go("home");loadSheet();
if(firstOpen)$("#welcome").hidden=false;
</script>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Fresh coconuts, onions, keerai and healthy foods in Sankarankovil, Tenkasi. Order on WhatsApp."><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meenthulli Fresh"><style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Meenthulli Fresh</title>
<meta property="og:title" content="Meenthulli Fresh · Sankarankovil">
<meta property="og:description" content="Fresh coconuts, onions, keerai and healthy foods. Order on WhatsApp, free delivery above ₹300.">
<meta property="og:image" content="https://meenthulli.com/graphics/fresh-design-2-farm.png">
<meta property="og:url" content="https://meenthulli.com/fresh/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#14361f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Mukta+Malar:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: "nordic bold" market app, the same family as Meenthulli Home Services in a green theme */
:root{
  --bg:#f2f4ee; --card:#ffffff; --ink:#14201a; --ink-2:#47534c; --mute:#7a857e; --line:#e1e6dd;
  --hero:#14361f; --lime:#c4e86b; --on-lime:#14361f;
  --coconut:#8a5a35; --veg:#c0566b; --greens:#3f8f3a; --healthy:#d4951c;
  --t-coconut:#f3e6d6; --t-veg:#f8e0e4; --t-greens:#e1f0d8; --t-healthy:#f8ecd0;
  --font:"Plus Jakarta Sans","Mukta Malar",system-ui,sans-serif;
  --nav-h:68px; --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c100d; --card:#18201a; --ink:#eef2ec; --ink-2:#c3cbc4; --mute:#8b968e; --line:#27302a;
  --t-coconut:#2c241b; --t-veg:#2e2023; --t-greens:#1b2a1a; --t-healthy:#2d2615; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c100d; --card:#18201a; --ink:#eef2ec; --ink-2:#c3cbc4; --mute:#8b968e; --line:#27302a;
  --t-coconut:#2c241b; --t-veg:#2e2023; --t-greens:#1b2a1a; --t-healthy:#2d2615; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 90px)}
h1,h2,h3,h4{font-weight:800;line-height:1.12;margin:0;letter-spacing:-.025em;text-wrap:balance;overflow-wrap:anywhere}
:lang(ta) h1,:lang(ta) h2,:lang(ta) h3,:lang(ta) h4{letter-spacing:0;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.tag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
:lang(ta) .tag{letter-spacing:0;text-transform:none;font-size:.9rem}

/* hero */
.hero{background:var(--hero);color:#fff;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:26px;border-radius:0 0 32px 32px;display:grid;gap:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:50px;width:240px;height:240px;border-radius:50%;background:var(--lime);opacity:.12}
.top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.logo{width:40px;height:40px;border-radius:12px;background:var(--lime);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.word{flex:1;min-width:0;line-height:1.15}
.word b{display:block;font-weight:800;font-size:1.1rem}
.word small{font-size:.78rem;color:#b9c8bd}
.tbtn{border:1px solid rgba(255,255,255,.22);background:none;color:#fff;border-radius:999px;height:40px;min-width:40px;padding:0 14px;display:grid;place-items:center;font-size:.9rem;font-weight:600;text-decoration:none}
.tbtn svg{width:18px;height:18px}
.hero .open{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:#d3dfd6;position:relative;z-index:1}
.hero .open i{width:8px;height:8px;border-radius:50%;background:#7be08f;box-shadow:0 0 0 4px rgba(123,224,143,.2)}
.hero h1{font-size:2.6rem;position:relative;z-index:1}
.hero h1 em{font-style:normal;color:var(--lime)}
:lang(ta) .hero h1{font-size:2rem}
.hero .lead{color:#c8d5cc;font-size:1rem;position:relative;z-index:1}
.search{display:flex;align-items:center;gap:10px;background:#fff;color:#14201a;border-radius:16px;padding:0 14px;height:52px;position:relative;z-index:1}
.search svg{width:20px;height:20px;color:#7a857e;flex:none}
.search input{border:0;background:none;font:inherit;font-size:1rem;color:#14201a;width:100%;min-width:0;outline:none}
.pg .search{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.pg .search input{color:var(--ink)}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.btn{border:0;border-radius:16px;padding:15px 16px;font-weight:700;font-size:1rem;background:var(--ink);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;gap:10px;justify-content:center;text-align:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.l{background:var(--lime);color:var(--on-lime)}
.btn.ghost{background:none;color:inherit;border:1.5px solid currentColor}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.btn.wa{background:#1f9d55;color:#fff}
.btn.block{display:flex;width:100%}

/* trust strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.strip div{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 8px;text-align:center;display:grid;gap:2px}
.strip b{font-weight:800;font-size:.95rem;color:var(--lime);line-height:1.2}
.strip span{font-size:.75rem;color:#c8d5cc}

.view{display:grid;gap:30px;padding-top:24px}
.view.first{padding-top:0}
.sec{display:grid;gap:14px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:10px}
.sh h2{font-size:1.55rem}
.sh .more{border:0;background:none;color:var(--ink-2);font-weight:700;font-size:.9rem;padding:0;display:flex;align-items:center;gap:4px;flex:none}
.sh .more svg{width:14px;height:14px}

/* category tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:var(--r);padding:14px;min-height:176px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.tile .pi{width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;align-self:flex-end;margin:-4px -4px 0 0}
.tile .pi svg{width:66px;height:66px}
.tile b{font-size:1.15rem;font-weight:800;line-height:1.2;display:block}
.tile small{font-size:.85rem;font-weight:600;opacity:.92}

/* journey showcase */
.works{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1*max(18px,env(safe-area-inset-left,0px)));padding-inline:max(18px,env(safe-area-inset-left,0px));scroll-padding-inline:18px;scrollbar-width:none}
.works::-webkit-scrollbar{display:none}
.work{flex:0 0 86%;scroll-snap-align:start;background:var(--card);border-radius:var(--r);overflow:hidden}
.work .sc{aspect-ratio:400/260;overflow:hidden}
.work .wb{padding:16px;display:grid;gap:6px}
.work h3{font-size:1.25rem}
.work p{color:var(--ink-2);font-size:.95rem}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:width .3s,background .3s}
.dots i.on{width:24px;background:var(--ink)}

/* products */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1*max(18px,env(safe-area-inset-left,0px)));padding-inline:max(18px,env(safe-area-inset-left,0px));scroll-padding-inline:18px;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .pc{flex:0 0 52%;scroll-snap-align:start}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--card);border-radius:20px;padding:10px;display:grid;gap:6px;align-content:start}
.pc .art{position:relative;border-radius:14px;aspect-ratio:1;overflow:hidden}
.pc .art svg{position:absolute;inset:12%;width:76%;height:76%}
.pc .art .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem}
.pc .new{position:absolute;top:8px;left:8px;background:var(--lime);color:var(--on-lime);font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 9px}
.pc h4{font-size:1rem;margin-top:2px}
.pc .ta{font-size:.8rem;color:var(--mute);margin-top:-4px}
.pc .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;min-height:40px}
.pr{font-weight:800;font-size:1.1rem}
.pr span{font-size:.75rem;color:var(--mute);font-weight:500;margin-left:2px}
.addb{border:0;background:var(--lime);color:var(--on-lime);border-radius:12px;height:38px;padding:0 12px;white-space:nowrap;font-size:.9rem;font-weight:800}
.step{display:flex;align-items:center;background:var(--ink);color:var(--bg);border-radius:12px;height:38px}
.step button{border:0;background:none;color:inherit;width:32px;height:38px;font-size:1.15rem;font-weight:700}
.step output{min-width:16px;text-align:center;font-weight:800;font-size:.92rem}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:.9rem;font-weight:600;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:30px 0;display:grid;gap:14px;justify-items:center;color:var(--mute)}
.empty svg{width:96px;height:96px}
.hint,.note{font-size:.9rem;color:var(--mute)}

/* steps + pay */
.steps{display:grid;background:var(--card);border-radius:var(--r);padding:6px 16px}
.steps div{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0}
.steps div+div{border-top:1px solid var(--line)}
.steps i{width:40px;height:40px;border-radius:12px;background:var(--hero);color:var(--lime);font-style:normal;font-weight:800;display:grid;place-items:center}
.steps b{display:block;font-weight:800;font-size:1.05rem;line-height:1.3}
.steps span{font-size:.92rem;color:var(--ink-2)}
.pays{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pays span{background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.88rem}
.pays b{font-size:.9rem;color:var(--ink-2);margin-right:4px}

/* share + other */
.share{background:var(--hero);color:#fff;border-radius:var(--r);padding:22px 18px;display:grid;gap:12px}
.share h3{font-size:1.4rem}
.share h3 em{font-style:normal;color:var(--lime)}
.share p{color:#c8d5cc;font-size:.94rem}
.other{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink)}
.other .dot{width:50px;height:50px;border-radius:14px;background:#121316;display:grid;place-items:center;flex:none}
.other .dot svg{width:26px;height:26px}
.other b{display:block;font-weight:800;line-height:1.25}
.other span{font-size:.88rem;color:var(--mute)}

/* page head */
.ph{display:grid;gap:6px;padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
.ph h2{font-size:2.1rem}
.pg{display:grid;gap:14px}

/* cart */
.card{background:var(--card);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.line{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center}
.line+.line{border-top:1px solid var(--line);padding-top:12px}
.line .art{width:58px;height:58px;border-radius:14px;position:relative;overflow:hidden}
.line .art svg{position:absolute;inset:10%;width:80%;height:80%}
.line .art .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem}
.line h4{font-size:1rem}
.line small{color:var(--mute);font-size:.82rem}
.sum{display:flex;justify-content:space-between;font-size:.96rem}
.sum .ok{color:#1f9d55;font-weight:700}
.sum.tot{border-top:1.5px dashed var(--line);padding-top:12px;font-weight:800;font-size:1.2rem}
.form{display:grid;gap:16px}
.lbl,.fld>span{font-size:.9rem;font-weight:700;color:var(--ink-2)}
.fld{display:grid;gap:6px}
.fld input,.fld textarea{font:inherit;font-size:1.05rem;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:13px 14px;border-radius:14px;width:100%;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg label{display:grid;place-items:center;text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:12px 4px;font-size:.92rem;font-weight:600;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.err{color:#d0342c;font-size:.92rem;font-weight:700}

/* account */
.list{background:var(--card);border-radius:var(--r);padding:0 16px}
.list>div{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:13px 0}
.list>div+div{border-top:1px solid var(--line)}
.list .i{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center}
.list .i svg{width:20px;height:20px}
.list b{display:block;font-size:.82rem;font-weight:600;color:var(--mute)}
.list span{font-weight:700;overflow-wrap:anywhere}
.sel{user-select:all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.order{padding:12px 0;display:grid}
.order+.order{border-top:1px solid var(--line)}
.order div{display:flex;justify-content:space-between;font-weight:800}
.small{font-size:.86rem;color:var(--mute)}

/* basket pill + tab bar */
.pill{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--nav-h) + 14px);z-index:19;display:flex;justify-content:center;padding-inline:18px;pointer-events:none}
.pill button{pointer-events:auto;width:100%;max-width:484px;border:0;border-radius:18px;background:var(--hero);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:800;box-shadow:0 12px 28px rgba(20,54,31,.35)}
.pill small{color:var(--lime);margin-right:8px;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .bar{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center}
.nav button,.nav a{border:0;background:none;display:grid;place-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--mute);text-decoration:none;height:100%;align-content:center;position:relative}
.nav svg{width:24px;height:24px}
.nav [aria-current="page"]{color:var(--ink)}
.nav [aria-current="page"]>svg{background:var(--lime);color:var(--on-lime);border-radius:10px;padding:3px;width:36px;height:28px}
.nav .bk .ring{width:58px;height:58px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;margin-top:-30px;box-shadow:0 8px 22px rgba(196,232,107,.5);border:4px solid var(--bg);position:relative}
.nav .bk .ring svg{width:26px;height:26px}
.nav .bk[aria-current="page"] .ring{background:var(--ink);color:var(--bg);box-shadow:none}
.nav a.wa{color:#1f9d55}
.badge{position:absolute;top:-4px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#d0342c;color:#fff;font-size:.75rem;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}

/* sheet, toast, welcome */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding-top:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);justify-self:center}
.sheet h3{font-size:1.6rem}
.msg{white-space:pre-wrap;font-size:.86rem;background:var(--card);border-radius:14px;padding:12px;margin:0;max-height:200px;overflow:auto;font-family:var(--font)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--nav-h) + 84px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.92rem;font-weight:700;z-index:45;white-space:nowrap}
.welcome{position:fixed;inset:0;z-index:60;background:var(--hero);color:#fff;display:grid;place-items:center;padding:24px}
.wbox{width:100%;max-width:380px;display:grid;gap:14px;text-align:center;justify-items:center}
.wbox .logo{width:76px;height:76px;border-radius:22px}
.wbox .logo svg{width:44px;height:44px}
.wbox h2{font-size:2.6rem}
.wbox p{color:#c8d5cc}
.wbox .q{margin-top:10px;font-weight:700;color:#fff}
.wbox .btn{font-size:1.2rem;padding:18px}
.wbox .btn.ta{font-family:"Mukta Malar",sans-serif;font-size:1.35rem}
.wbox .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}

/* animations: only when the phone allows motion */
@media (prefers-reduced-motion:no-preference){
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.82) translateY(14px)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-18px,22px) scale(1.08)}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(123,224,143,.6)}100%{box-shadow:0 0 0 10px rgba(123,224,143,0)}}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(196,232,107,.7),0 8px 22px rgba(196,232,107,.5)}100%{box-shadow:0 0 0 16px rgba(196,232,107,0),0 8px 22px rgba(196,232,107,.5)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-3deg)}}
  @keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(320%) skewX(-20deg)}}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  .scrim:not([hidden]) .sheet{animation:up .3s cubic-bezier(.2,.8,.3,1)}
  main.view:not([hidden]){animation:viewIn .4s cubic-bezier(.2,.7,.2,1)}
  .hero>*:not(.top){opacity:0}
  .play .hero>*:not(.top){opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .hero .open{animation-delay:.05s}.hero h1{animation-delay:.14s}.hero .lead{animation-delay:.22s}.hero .search{animation-delay:.3s}.hero .cta{animation-delay:.38s}.hero .strip{animation-delay:.46s}
  .hero::after{animation:float 9s ease-in-out infinite}
  .hero .open i{animation:pulse 1.6s ease-out infinite}
  .hero .btn.l{position:relative;overflow:hidden}
  .hero .btn.l::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 3.2s ease-in-out 1.2s infinite}
  .tile{opacity:0;transition:transform .15s}
  .play .tile{opacity:1;animation:pop .6s cubic-bezier(.2,.8,.3,1.15) backwards}
  .tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}.tile:nth-child(4){animation-delay:.24s}
  .tile .pi svg{animation:bob 3s ease-in-out infinite}

function go(v){
  tab=v;document.body.dataset.tab=v;
  $$(".view[id^='v-']").forEach(e=>e.hidden=e.id!=="v-"+v);
  $$(".nav button").forEach(b=>{if(b.dataset.tab===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(v==="cart")renderCart();if(v==="more")renderOrders();
  refreshBadges();window.scrollTo(0,0);
}
let toastT;
function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,1400)}
function sheet(html){$("#sheet").innerHTML=`<div class="grab"></div>`+html;$("#scrim").hidden=false;const f=$("#sheet").querySelector("input,button,a");f&&f.focus()}
function closeSheet(){$("#scrim").hidden=true}
function sentSheet(msg){
  sheet(`<h3>${t("sentT")}</h3><p class="hint">${t("sentP")}</p><pre class="msg">${esc(msg)}</pre>
   <a class="btn wa block" href="${wa(msg)}" target="_blank" rel="noopener">${t("openWa")}</a>
   <p class="hint" style="text-align:center">${SHOP.phoneShow}</p>
   <button class="btn ghost block" type="button" data-close>${t("close")}</button>`);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a");
  if(e.target.id==="scrim"){closeSheet();return}
  if(!b)return;
  if(b.dataset.tab)return go(b.dataset.tab);
  if(b.dataset.goto)return go(b.dataset.goto);
  if(b.dataset.cat){cat=b.dataset.cat;renderShop();return go("shop")}
  if(b.dataset.chip){cat=b.dataset.chip;return renderShop()}
  if(b.hasAttribute("data-share")){const m=t("shareMsg")+" "+SHOP.shareUrl;if(navigator.share){navigator.share({text:m}).catch(()=>{})}else{location.href="https://wa.me/?text="+encodeURIComponent(m)}return}
  if(b.hasAttribute("data-close"))return closeSheet();
  if(b.dataset.d){
    const id=b.dataset.id, was=cart[id]||0;
    cart[id]=Math.max(0,was+Number(b.dataset.d));
    if(!cart[id])delete cart[id];
    if(!was)toast(t("added"));
    const p=P.find(x=>x.id===id);
    $$(`[data-slot="${id}"]`).forEach(s=>s.innerHTML=stepper(p));
    if(tab==="cart")renderCart();
    refreshBadges();
  }
});
$("#lang").onclick=()=>{lang=lang==="en"?"ta":"en";store.set("lang",lang);applyLang()};
function applyTheme(v){if(v==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;$$("[name=s-theme]").forEach(i=>i.checked=i.value===v)}
applyTheme(store.get("theme","auto"));
$$("[name=s-theme]").forEach(i=>i.onchange=()=>{store.set("theme",i.value);applyTheme(i.value)});
$$("[name=s-lang]").forEach(i=>i.onchange=()=>{lang=i.value;store.set("lang",lang);applyLang()});
$("#clearMe").onclick=()=>{store.set("addr",{});store.set("orders",[]);cart={};renderAll();$("#clearDone").hidden=false};
["#q1","#q2"].forEach(s=>$(s).addEventListener("input",e=>{query=e.target.value;$("#q1").value=$("#q2").value=query;renderShop();if(tab!=="shop"){go("shop");$("#q2").focus()}}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const v=id=>(document.getElementById(id)?.value||"").trim();
  if(e.target.id==="checkout"){
    const name=v("c-name"),phone=v("c-phone").replace(/\D/g,""),address=v("c-addr");
    const slot=document.querySelector('[name=slot]:checked').value,pay=document.querySelector('[name=pay]:checked').value;
    if(!name||phone.length!==10||!address){const er=$("#c-err");er.textContent=t("fill");er.hidden=false;return}
    store.set("addr",{name,phone,address,slot,pay});
    const {items,sub,fee,total}=totals();
    const msg=`Vanakkam Meenthulli Fresh! New order 🛒\n\n`+items.map(p=>`• ${p.en} (${p.ta}) × ${cart[p.id]} ${p.unit} = ₹${p.price*cart[p.id]}`).join("\n")+
      `\n\nItems: ₹${sub}\nDelivery: ${fee?"₹"+fee:"Free"}\nTotal: ₹${total}\n\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\nTime: ${slot==="evening"?"Evening 5–8":"Morning 7–10"}\nPayment: ${pay==="upi"?"UPI":"Cash"} on delivery`+(v("c-note")?`\nNote: ${v("c-note")}`:"");
    const o=store.get("orders",[]);
    o.push({when:new Date().toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}),total,items:items.map(p=>`${nm(p)} × ${cart[p.id]}`).join(", ")});
    store.set("orders",o.slice(-20));
    cart={};refreshBadges();renderCart();renderShop();renderHome();
    sentSheet(msg);
  }
});
/* journey slider: dots follow the swipe, and it moves on by itself until the person touches it */
const works=$("#works");let wi=0,touched=false;
works.addEventListener("scroll",()=>{const c=works.children[0];if(!c)return;wi=Math.round(works.scrollLeft/(c.offsetWidth+14));$$("#dots i").forEach((d,i)=>d.classList.toggle("on",i===wi))},{passive:true});
["pointerdown","touchstart"].forEach(ev=>works.addEventListener(ev,()=>touched=true,{passive:true}));
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)setInterval(()=>{if(touched||tab!=="home"||document.hidden||!$("#welcome").hidden)return;const n=(wi+1)%works.children.length,c=works.children[n];works.scrollTo({left:c.offsetLeft-works.children[0].offsetLeft,behavior:"smooth"})},4500);
// install button, works when the site is hosted as an app
let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#installBtn").hidden=true};
try{if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]'))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
// Load products from Google Sheet if set (columns: id,category,name_en,name_ta,unit_en,unit_ta,price,emoji,fresh,available)
function parseCSV(txt){const rows=[];let r=[],c="",q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows}
async function loadSheet(){
  if(!SHOP.sheetCSV)return;
  try{
    const rows=parseCSV(await (await fetch(SHOP.sheetCSV,{cache:"no-store"})).text());
    const h=rows.shift().map(x=>x.trim().toLowerCase());const g=(r,k)=>(r[h.indexOf(k)]||"").trim();
    const list=rows.filter(r=>g(r,"name_en")&&!/^(no|n|0)$/i.test(g(r,"available"))).map((r,i)=>({id:g(r,"id")||"s"+i,cat:CATS.some(c=>c.id===g(r,"category"))?g(r,"category"):"healthy",en:g(r,"name_en"),ta:g(r,"name_ta")||g(r,"name_en"),unit:g(r,"unit_en")||"each",uta:g(r,"unit_ta")||g(r,"unit_en")||"ஒன்று",price:Number(g(r,"price"))||0,ico:g(r,"emoji")||"🛒",custom:!!g(r,"emoji"),tag:/^(yes|y|1)$/i.test(g(r,"fresh"))}));
    if(list.length){P.length=0;P.push(...list);Object.keys(cart).forEach(k=>{if(!P.some(p=>p.id===k))delete cart[k]});renderAll()}
  }catch(e){}
}
const firstOpen=store.get("lang",null)===null;
$$("[data-wl]").forEach(b=>b.onclick=()=>{lang=b.dataset.wl;store.set("lang",lang);applyLang();$("#welcome").hidden=true;$("#v-home").classList.add("play")});
applyLang();go("home");loadSheet();
if(firstOpen)$("#welcome").hidden=false;else $("#v-home").classList.add("play");
</script>
</body></html>

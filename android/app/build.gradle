plugins { id 'com.android.application' }

android {
    namespace 'com.meenthulli.app'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName = "1.0." + (System.getenv("VERSION_CODE") ?: "1")
    }

    flavorDimensions = ["app"]
    productFlavors {
        fresh {
            dimension "app"
            applicationId "com.meenthulli.fresh"
        }
        services {
            dimension "app"
            applicationId "com.meenthulli.homeservices"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

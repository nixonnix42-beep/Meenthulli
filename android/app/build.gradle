plugins { id 'com.android.application' }

android {
    namespace 'com.meenthulli.app'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions = ["app"]
    productFlavors {
        fresh {
            dimension "app"
            applicationId "com.meenthulli.fresh"
        }
        services {
            dimension "app"
            applicationId "com.meenthulli.homeservices"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

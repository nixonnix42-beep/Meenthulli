name: Publish website and Android apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Put app pages inside the Android apps
        run: |
          SITE="https://nixonnix42-beep.github.io/Meenthulli"
          for app in fresh services; do
            mkdir -p android/app/src/$app/assets
            rm -rf android/app/src/$app/assets/www
            cp -r site/$app android/app/src/$app/assets/www
          done
          sed -i "s#otherApp:\"../services/\"#otherApp:\"$SITE/services/\"#" android/app/src/fresh/assets/www/index.html
          sed -i "s#otherApp:\"../fresh/\"#otherApp:\"$SITE/fresh/\"#" android/app/src/services/assets/www/index.html

      - name: Build Android apps
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleFreshDebug assembleServicesDebug bundleFreshRelease bundleServicesRelease

      - name: Add apps to the website
        run: |
          mkdir -p site/apps
          cp android/app/build/outputs/apk/fresh/debug/app-fresh-debug.apk site/apps/meenthulli-fresh.apk
          cp android/app/build/outputs/apk/services/debug/app-services-debug.apk site/apps/meenthulli-home-services.apk
          mkdir -p playstore
          cp android/app/build/outputs/bundle/freshRelease/app-fresh-release.aab playstore/meenthulli-fresh-unsigned.aab
          cp android/app/build/outputs/bundle/servicesRelease/app-services-release.aab playstore/meenthulli-home-services-unsigned.aab

      - name: Update the download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-apps --yes --cleanup-tag || true
          gh release create android-apps site/apps/*.apk playstore/*.aab --title "Meenthulli Android apps" --notes "Download the .apk on your Android phone and tap it to install."

      - name: Publish website to the gh-pages branch
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish website"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
